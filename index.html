<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zachary Chermak</title>
  <style>
    :root {
      --header-bg: #c62828; /* red */
      --header-foreground: #ffffff;
      --nav-hover-bg: rgba(255,255,255,0.08);
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #111;
    }
    .site-header {
      background: var(--header-bg);
      color: var(--header-foreground);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .site-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
    }
    .site-nav {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .site-nav a {
      color: var(--header-foreground);
      text-decoration: none;
      padding: 0.5rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .site-nav a:hover,
    .site-nav a:focus {
      background: var(--nav-hover-bg);
      outline: none;
    }
    /* Responsive: collapse nav on small screens (simple approach) */
    @media (max-width: 640px) {
      .site-nav {
        display: none; /* optionally replace with a hamburger menu implementation */
      }
      .site-title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="site-title">Zachary Chermak</div>
    <nav class="site-nav" role="navigation" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/projects">Projects</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Page content goes here -->
  </main>
</body>
</html>
